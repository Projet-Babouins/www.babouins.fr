# Met le site en ligne sur GitHub Pages à chaque merge sur main.
# Workflow officiel Astro : https://docs.astro.build/en/guides/deploy/github/
name: Déploiement sur GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de lancer le déploiement à la main, depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v7
      - name: Installer, construire et envoyer le site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
